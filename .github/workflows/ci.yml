name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-app:
    name: Build macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build (unsigned)
        run: swift build --package-path OpenRecApp -c release

  build-web:
    name: Build website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  test-cloud:
    name: Test cloud worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm test
