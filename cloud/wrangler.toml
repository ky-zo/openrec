name = "openrec-cloud"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Keep workers.dev available for already-shipped app builds while new builds
# and OAuth callbacks use the api.openrec.co custom domain.
workers_dev = true
routes = [
  { pattern = "api.openrec.co", custom_domain = true }
]

[vars]
PUBLIC_BASE_URL = "https://api.openrec.co"

[[d1_databases]]
binding = "DB"
database_name = "openrec"
database_id = "611a5823-7434-4a89-9e08-0a03f1b3ed43"

[[r2_buckets]]
binding = "RECORDINGS"
bucket_name = "openrec-recordings"
